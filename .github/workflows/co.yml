name: "CO Production Operations"
# 定时任务只做生产巡检；手动触发才安装不可变发布制品。

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      release_id:
        description: "CD 制品对应的 release ID（例如 20261006T000000Z-<sha>）"
        required: true
        type: string
      archive_url:
        description: "CD workflow run ID（不是 URL；例如 37435069059）"
        required: true
        type: string

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  health-check:
    name: Tencent Cloud production health probe
    runs-on: ubuntu-latest
    environment: cw-tc-production
    steps:
      - name: 检查公网入口
        env:
          BASE_URL: ${{ secrets.DEPLOY_BASE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_id }}" ]; then
            echo "审批部署模式：先执行服务器侧 SSH 安装与本机 health，公网 DNS 由安装后单独验收。"
            exit 0
          fi
          test -n "$BASE_URL"
          curl -fsS --max-time 15 "$BASE_URL/api/v1/health"
          curl -fsS --max-time 15 "$BASE_URL/api/v1/public/status"

  approved-install:
    name: Approved server-side release install
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: health-check
    runs-on: ubuntu-latest
    environment: cw-tc-production
    steps:
      - name: 校验生产部署凭据已配置（不输出秘密）
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST" || { echo '缺少 GitHub Environment secret: DEPLOY_HOST' >&2; exit 1; }
          test -n "$DEPLOY_USER" || { echo '缺少 GitHub Environment secret: DEPLOY_USER' >&2; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo '缺少 GitHub Environment secret: DEPLOY_SSH_KEY' >&2; exit 1; }

      - name: 下载已审批不可变制品
        env:
          RUN_ID: ${{ inputs.archive_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # 输入兼容旧字段，但现在应填写 CD workflow run ID；下载走 GitHub 鉴权，
          # 不接受未鉴权的任意 URL，避免把未经审批的外部文件送入生产。
          test -n "$RUN_ID"
          HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .head_sha)
          ARTIFACT="cw-tc-release-${HEAD_SHA}"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir release-download
          ARCHIVE=$(find release-download -type f -name '*.tar.gz' -print -quit)
          test -n "$ARCHIVE"
          cp "$ARCHIVE" release.tar.gz

      - name: 上传已审批不可变制品
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: release.tar.gz
          target: /opt/cw-tc/incoming

      - name: SSH 安装到既有腾讯云服务器
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            test -f /opt/cw-tc/shared/.env
            RELEASE_ID='${{ inputs.release_id }}'
            INSTALLER="/opt/cw-tc/releases/$RELEASE_ID/deploy/server-install-release.sh"
            test -x "$INSTALLER"
            DEPLOY_PATH=/opt/cw-tc RELEASE_ID="$RELEASE_ID" bash "$INSTALLER" /opt/cw-tc/incoming/release.tar.gz
            rm -f /opt/cw-tc/incoming/release.tar.gz

  incident-dedup:
    name: Incident deduplication
    if: ${{ failure() }}
    needs: [health-check, approved-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const title = '[告警] cw-tc 生产巡检或审批部署失败';
            const label = 'cw-tc-prod-incident';
            const { data } = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label, per_page: 100});
            if (!data.some(i => i.title === title)) {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, labels: [label], body: `时间：${new Date().toISOString()}\nRun：${context.runId}\n请按变更单检查既有腾讯云服务器、PostgreSQL、Redis 与 nginx。`});
            }
