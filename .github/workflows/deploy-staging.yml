name: "Deploy Staging (cw-tc.ccit-agent.cn)"

# 仅部署到 staging：CI（main）通过后自动，或在 Actions 里手动触发。
# 采用「服务器端构建」：SSH 到服务器执行 /opt/cw-tc-build/deploy-staging.sh
# （拉最新 main → go build linux → 组装 release → 软链切换 → 重启 → 健康检查），
# 因此**不依赖** CI/本机产出的目标平台二进制。
#
# 生产发布不在此处：按 docs/PRD-第三课堂-v2.md §12，生产走审批门禁（cd.yml 只出审批材料）。

on:
  workflow_run:
    workflows: ["CI Quality Gate"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: SSH → 服务器端构建 + 部署到 staging
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: 触发服务器端部署脚本
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'set -euo pipefail
             SCRIPT=$(readlink -f /opt/cw-tc-build/deploy-staging.sh)
             test -f "$SCRIPT"
             OWNER=$(stat -c "%U:%G" "$SCRIPT")
             sudo cp -a "$SCRIPT" "$SCRIPT.bak.$(date +%Y%m%d%H%M%S)"
             if grep -q -- ") --web-renderer html" "$SCRIPT"; then
               sudo sed -i "s#) --web-renderer html#--web-renderer html )#" "$SCRIPT"
             fi
             if ! grep -q -- "flutter build web --release --base-href=/student/ --web-renderer html" "$SCRIPT"; then
               sudo sed -i "s#flutter build web --release --base-href=/student/#flutter build web --release --base-href=/student/ --web-renderer html#" "$SCRIPT"
             fi
             sudo chown "$OWNER" "$SCRIPT"
             echo "--- flutter build web ---"
             grep -n "flutter build web" "$SCRIPT" || true
             grep -q -- "flutter build web --release --base-href=/student/ --web-renderer html" "$SCRIPT"
             bash /opt/cw-tc-build/deploy-staging.sh'

      - name: 验证学员端为 HTML 渲染器
        run: |
          for i in $(seq 1 24); do
            BODY=$(curl -fsS --max-time 10 "https://cw-tc.ccit-agent.cn/student/flutter_bootstrap.js?ts=$(date +%s)" || true)
            if printf '%s' "$BODY" | grep -q '"renderer":"html"'; then
              echo "学员端已切换为 HTML 渲染器"
              break
            fi
            sleep 5
          done
          if ! printf '%s' "$BODY" | grep -q '"renderer":"html"'; then
            echo "学员端仍不是 HTML 渲染器" >&2
            printf '%s\n' "$BODY" | grep -o '"renderer":"[a-z]*"' || true
            exit 1
          fi
          if curl -fsS --max-time 30 "https://cw-tc.ccit-agent.cn/student/main.dart.js" | grep -q 'fonts.gstatic.com'; then
            echo "main.dart.js 仍引用 fonts.gstatic.com" >&2
            exit 1
          fi
          echo "学员端资源校验通过"
