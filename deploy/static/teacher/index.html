 <h1>教师端</h1>
 <p>教师端面向授课教师，提供课程与题库管理、组卷、批阅与成绩分析等能力。</p>
 <h2>主要功能</h2>
 <ul>
  <li>课程与章节、教学资料管理</li>
  <li>题库维护、自动/手动组卷</li>
  <li>在线批阅、成绩统计与导出</li>
  <li>学生学习进度与预警</li>
 </ul>
