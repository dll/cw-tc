# cw-tc.ccit-agent.cn 反向代理配置
# 放置：/etc/nginx/conf.d/cw-tc.conf
# 说明：应用服务监听 127.0.0.1:8071（与 cw-vopc 的 8070 区分，避免端口冲突）

# ---- HTTP → HTTPS 强制跳转 ----
server {
    listen 80;
    listen [::]:80;
    server_name cw-tc.ccit-agent.cn;

    # ACME 挑战放行（首次签发证书用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS 主站 ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cw-tc.ccit-agent.cn;

    # 腾讯云免费证书 / Let's Encrypt（路径按实际调整）
    ssl_certificate     /etc/nginx/ssl/cw-tc.ccit-agent.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/cw-tc.ccit-agent.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # HSTS（首次上线建议先用短 max-age，确认无碍后加长）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 上传/提交体积（答题卡、附件）
    client_max_body_size 20M;

    access_log /var/log/nginx/cw-tc-access.log;
    error_log  /var/log/nginx/cw-tc-error.log;

    # 静态资源（课件/音视频）——若走 COS+CDN，可把这段换成 CDN 域名 302
    # location /assets/ { proxy_pass https://<cos-cdn-domain>/; }

    # 健康检查（不记日志）
    location = /api/v1/health {
        proxy_pass http://127.0.0.1:8071/api/v1/health;
        access_log off;
    }

    # 应用主入口
    location / {
        proxy_pass http://127.0.0.1:8071;
        proxy_http_version 1.1;

        # WebSocket（如需实时通知）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 大文件下载（课件/证书 PDF）走流式
        proxy_buffering off;
    }
}
