# cw-tc.ccit-agent.cn 反向代理配置
# 放置：/etc/nginx/conf.d/cw-tc.conf
# 说明：应用服务监听 127.0.0.1:8071；管理端 /admin/、学员端 /student/、门户 / 由 nginx 静态托管。

# ---- HTTP 到 HTTPS 强制跳转 ----
server {
    listen 80;
    listen [::]:80;
    server_name cw-tc.ccit-agent.cn;

    # ACME 挑战目录（首次签发证书用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS 站点 ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cw-tc.ccit-agent.cn;

    # 腾讯云托管证书 / Let's Encrypt，路径按实际部署调整
    ssl_certificate     /etc/nginx/ssl/cw-tc.ccit-agent.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/cw-tc.ccit-agent.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # HSTS：首次上线先观察，确认无明文依赖后再启用 max-age
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 上传/提交请求体限制
    client_max_body_size 20M;

    access_log /var/log/nginx/cw-tc-access.log;
    error_log  /var/log/nginx/cw-tc-error.log;

    # 健康检查不写访问日志
    location = /api/v1/health {
        proxy_pass http://127.0.0.1:8071/api/v1/health;
        access_log off;
    }

    # 后端 API（含签名资源、证书验真、支付回调）
    location /api/ {
        proxy_pass http://127.0.0.1:8071;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering off;
    }

    # 管理端 SPA（构建 base=/admin/）
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        root /var/www/cw-tc;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 学员端 Flutter Web SPA（构建 base-href=/student/）
    location = /student {
        return 301 /student/;
    }
    location /student/ {
        root /var/www/cw-tc;
        index index.html;
        try_files $uri $uri/ /student/index.html;
    }

    # 公司官网 / 门户静态页（/about /privacy /terms /help 等）
    location / {
        root /var/www/cw-tc/portal;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
